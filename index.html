<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/select-electrical/images/Select-Logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Select Electrical Enterprises Ltd. - Professional electrical, automation and controls company serving Alberta since 1988. VFDs, MCCs, switchboards, electric motors and more." />
    <title>Select Electrical Enterprises Ltd.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // GitHub Pages SPA: restore path that was encoded by 404.html redirect.
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query param approach
        var search = window.location.search;
        if (search.slice(1,3) === 'p=') {
          var decoded = search.slice(1).split('&').reduce(function(memo, part) {
            var kv = part.split('=');
            memo[kv[0]] = kv.slice(1).join('=').replace(/~and~/g, '&');
            return memo;
          }, {});
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + (decoded.p || '') +
            (decoded.q ? '?' + decoded.q : '') +
            window.location.hash
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
